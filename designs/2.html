<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Gyroscope Core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 100%; height: 100%; cursor: grab; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<script src="three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
  camera.position.z = 5.6;

  const root = new THREE.Group();
  scene.add(root);

  const CYAN = 0x38bdf8, BLUE = 0x2563eb, GOLD = 0xf59e0b;

  function makeArcRing(radius, tube, arcAngle, color, opacity) {
    const geo = new THREE.TorusGeometry(radius, tube, 16, 100, arcAngle);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity, blending: THREE.AdditiveBlending
    });
    return new THREE.Mesh(geo, mat);
  }

  // Gimbal 1: Outer segmented ring
  const gimbal1 = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const arc = makeArcRing(1.75, 0.022, Math.PI * 0.48, CYAN, 0.85);
    arc.rotation.z = (i * Math.PI * 2) / 3;
    gimbal1.add(arc);
  }
  root.add(gimbal1);

  // Gimbal 2: Middle tilted gyro ring
  const gimbal2 = new THREE.Group();
  gimbal2.add(makeArcRing(1.42, 0.018, Math.PI * 1.65, BLUE, 0.9));
  gimbal2.add(makeArcRing(1.32, 0.01, Math.PI * 2, CYAN, 0.4));
  root.add(gimbal2);

  // Gimbal 3: Inner precision ring with accent color
  const gimbal3 = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const arc = makeArcRing(1.05, 0.025, Math.PI * 0.32, GOLD, 0.85);
    arc.rotation.z = (i * Math.PI) / 2;
    gimbal3.add(arc);
  }
  root.add(gimbal3);

  // Inner Reactor Core
  const coreGeo = new THREE.OctahedronGeometry(0.52, 1);
  const coreWire = new THREE.LineSegments(
    new THREE.EdgesGeometry(coreGeo),
    new THREE.LineBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.95 })
  );
  const coreGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 24, 24),
    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending })
  );
  root.add(coreWire, coreGlow);

  // Orbiting telemetry dots
  const tickCount = 72;
  const tickPos = new Float32Array(tickCount * 3);
  for (let i = 0; i < tickCount; i++) {
    const a = (i / tickCount) * Math.PI * 2;
    tickPos.set([Math.cos(a) * 2.02, Math.sin(a) * 2.02, 0], i * 3);
  }
  const tickGeo = new THREE.BufferGeometry();
  tickGeo.setAttribute("position", new THREE.BufferAttribute(tickPos, 3));
  const ticks = new THREE.Points(
    tickGeo,
    new THREE.PointsMaterial({ color: CYAN, size: 0.045, transparent: true, opacity: 0.6 })
  );
  root.add(ticks);

  let state = "idle", extAudio = 0, extTime = 0, mouseX = 0, mouseY = 0;
  window.addEventListener("pointermove", e => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 0.7;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 0.7;
  });

  function resize() {
    const w = stage.clientWidth || 300, h = stage.clientHeight || 300;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  let last = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    const audio = (now - extTime < 220)
      ? extAudio
      : (state === "speaking" ? 0.4 + 0.4 * Math.abs(Math.sin(now * 0.009))
        : state === "listening" ? 0.25 : 0.05);

    const speed = state === "thinking" ? 3.2 : state === "speaking" ? 1.8 : 0.7;

    gimbal1.rotation.x += dt * 0.45 * speed;
    gimbal1.rotation.y += dt * 0.30 * speed;

    gimbal2.rotation.y -= dt * 0.65 * speed;
    gimbal2.rotation.z += dt * 0.35 * speed;

    gimbal3.rotation.x -= dt * 0.85 * speed;
    gimbal3.rotation.z -= dt * 0.50 * speed;

    ticks.rotation.z += dt * 0.15 * speed;

    const pulse = 1 + audio * 0.35 + Math.sin(now * 0.003) * 0.04;
    coreWire.scale.setScalar(pulse);
    coreWire.rotation.y += dt * 1.2;
    coreGlow.scale.setScalar(pulse * 1.15);
    coreGlow.material.opacity = 0.25 + audio * 0.5;

    // Smooth cursor parallax tilt
    root.rotation.y += (mouseX - root.rotation.y) * dt * 4;
    root.rotation.x += (mouseY - root.rotation.x) * dt * 4;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  window.JarvisOrb = {
    setState: s => state = s,
    setExternalAudio: lvl => { extAudio = Number(lvl) || 0; extTime = performance.now(); },
    startListening: () => state = "listening",
    startThinking: () => state = "thinking",
    startSpeaking: () => state = "speaking",
    stopSpeaking: () => state = "idle"
  };
})();
</script>
</body>
</html>
